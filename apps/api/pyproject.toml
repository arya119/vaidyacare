[project]
name = "vaidyacare-api"
version = "0.1.0"
description = "VaidyaCare FastAPI backend — SIH26047"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.2.5",
    # Pydantic
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    # AI / Speech (TECHNICAL_DESIGN §4, §5)
    "faster-whisper>=1.0.0",
    "rapidfuzz>=3.9.0",
    "onnxruntime>=1.18.0",
    "sentence-transformers>=3.0.0",
    # FHIR
    "fhir.resources>=7.1.0",
    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
